<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --cork: #C7C7C2;
    --cork-dark: #8B8B86;
    --frame: #1E1E1E;
    --ink: #1A1A1A;
    --ink-soft: #5A5A5A;
    --paper-shadow: rgba(0, 0, 0, 0.35);
    --tape: rgba(255, 255, 255, 0.6);
    --gold: #F2F2F2;
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    margin: 0;
    background: var(--frame);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
    height: 100%;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--frame);
    padding: 14px 20px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 6px solid var(--cork-dark);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .topbar-left { max-width: 560px; }
  .wordmark { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 25px; letter-spacing: 0.4px; color: #FFFFFF; margin: 0; text-transform: uppercase; line-height: 1.05; }
  .tagline { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #C4C4C4; margin: 5px 0 0; line-height: 1.4; white-space: nowrap; }
  .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .stats-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .stat {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #D4D4D4; text-align: right; line-height: 1.3;
  }
  .stat b { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; color: var(--gold); }
  .add-btn {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.4px;
    background: var(--gold); color: #241C12; border: none; padding: 10px 16px; border-radius: 3px; cursor: pointer;
    box-shadow: 0 2px 0 #3A3A3A; white-space: nowrap;
  }
  .add-btn:hover { background: #E0E0E0; }
  .add-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #3A3A3A; }
  .add-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- Board ---------- */
  .board-scroll {
    position: absolute; top: 92px; left: 0; right: 0; bottom: 0;
    overflow: auto;
  }
  .board {
    position: relative;
    min-width: 100%; min-height: 100%;
    background-color: var(--cork);
    background-image:
      radial-gradient(rgba(0,0,0,0.10) 1px, transparent 1.2px),
      radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1.2px);
    background-size: 7px 7px, 7px 7px;
    background-position: 0 0, 3.5px 3.5px;
  }

  .timeline-header {
    position: sticky; top: 0; left: 0; width: 100%; min-width: 100%; height: 50px; z-index: 60; pointer-events: none;
  }
  .timeline-col-label {
    position: absolute; top: 0; height: 50px; display: flex; align-items: center; justify-content: center;
    background: rgba(30, 30, 30, 0.92); border-right: 1px solid rgba(255,255,255,0.15);
  }
  .timeline-col-label span {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #FFFFFF; text-align: center;
    text-transform: uppercase; letter-spacing: 0.4px; padding: 0 6px; line-height: 1.3;
  }
  .timeline-divider {
    position: absolute; top: 50px; bottom: 0; width: 1px; background: rgba(0,0,0,0.15); pointer-events: none;
  }
  .timeline-arrow {
    position: absolute; top: 16px; right: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #D4D4D4;
  }

  .board-hint {
    position: absolute; top: 66px; left: 24px; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: rgba(255,255,255,0.55); pointer-events: none; max-width: 220px; line-height: 1.5; z-index: 5;
  }

  /* ---------- Sticky notes ---------- */
  .note-wrap {
    position: absolute; width: 176px; touch-action: none; cursor: grab; user-select: none;
  }
  .note-wrap.dragging { cursor: grabbing; z-index: 999 !important; }
  .note-wrap:focus-visible .note { outline: 2px solid #fff; outline-offset: 2px; }

  .note {
    box-shadow: 2px 4px 10px var(--paper-shadow);
    height: 176px;
    display: flex; flex-direction: column;
    border-radius: 2px;
    border: 1.5px solid var(--ink);
    overflow: hidden;
    background: #fff;
  }
  .note-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--ink); color: #fff;
    padding: 5px 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note-head .note-from { text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .note-head .note-stage-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; flex-shrink: 0; opacity: 0.7; }

  .note-meta { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; line-height: 1.5; color: rgba(36,28,18,0.75); }
  .note-meta b { font-weight: 600; }
  .note-divider { border: none; border-top: 1px dashed rgba(36,28,18,0.3); margin: 6px 0; }

  .note-body-wrap { background: var(--note-color, #eee); flex: 1; padding: 10px 10px 6px; display: flex; flex-direction: column; }
  .note-body {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13.5px; line-height: 1.35; color: var(--ink);
    margin: 0; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
  }
  .note-footer { font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: rgba(36,28,18,0.65); margin-top: 6px; text-align: right; text-transform: uppercase; letter-spacing: 0.3px; }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20, 13, 5, 0.6); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
  }
  .modal {
    background: #F5F5F5; border-radius: 6px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto;
    padding: 24px; font-family: 'IBM Plex Mono', monospace; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal-close {
    float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-soft); line-height: 1;
    padding: 4px;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-note-preview {
    padding: 16px; border-radius: 3px; margin-bottom: 18px; box-shadow: 3px 5px 10px rgba(0,0,0,0.15);
  }
  .modal-note-preview .note-meta { font-size: 12px; }
  .modal-note-preview .note-body { font-size: 16px; line-height: 1.6; -webkit-line-clamp: unset; }

  .replies-heading { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--ink-soft); margin: 20px 0 10px; }
  .reply-item { border-left: 3px solid #D5D5D5; padding: 2px 0 2px 12px; margin-bottom: 14px; }
  .reply-author { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 3px; }
  .reply-body { font-family: 'Source Sans 3', sans-serif; font-size: 14px; color: var(--ink); white-space: pre-wrap; line-height: 1.5; }

  .form-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; margin: 0 0 16px; color: var(--ink); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .field input[type="text"], .field textarea, .field select {
    width: 100%; font-family: 'Source Sans 3', sans-serif; font-size: 14.5px; padding: 9px 11px;
    border: 1px solid #D9CDB0; border-radius: 3px; background: #fff; color: var(--ink);
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { outline: 2px solid #8A8A8A; outline-offset: 1px; }

  .vibe-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .vibe-swatch {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 12px 7px 8px; border-radius: 20px; border: 1.5px solid #D0D0D0; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink); background: #fff;
  }
  .vibe-swatch .dot { width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }
  .vibe-swatch.selected { border-color: var(--ink); background: #F3F0E8; font-weight: 600; }
  .vibe-swatch:hover { border-color: var(--ink-soft); }

  .form-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-primary, .btn-secondary {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 10px 16px; border-radius: 3px; cursor: pointer; border: none;
  }
  .btn-primary { background: var(--frame); color: #FFFFFF; }
  .btn-primary:hover { background: #333333; }
  .btn-secondary { background: none; color: var(--ink-soft); border: 1px solid #D9CDB0; }
  .error-note { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #A83A3A; margin-top: 8px; }

  @media (max-width: 640px) {
    .topbar { flex-direction: column; align-items: stretch; }
    .topbar-right { align-items: flex-start; }
    .stats-row { justify-content: flex-start; }
    .board-scroll { top: 148px; }
  }
</style>

<div class="topbar">
  <div class="topbar-left">
    <p class="wordmark">The ACL Collective</p>
    <p class="tagline">a collection of reflections, feelings, and experiences fostering community through recovery</p>
  </div>
  <div class="topbar-right">
    <div class="stats-row" id="stats-row"></div>
    <button class="add-btn" id="topbar-add">+ Add a sticky note</button>
  </div>
</div>

<div class="board-scroll" id="board-scroll">
  <div class="board" id="board">
    <div class="board-hint" id="board-hint">Click anywhere on the board to pin a note. Drag any note to reposition it within its column.</div>
  </div>
</div>

<div id="modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = "https://nyygbvupxtgmfcmwqzwp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_xJwX2r5KzwVaso8NnIBp2Q_fhPNs-ba";
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const PROFILE_KEY = "graft-profile-name";

  const VIBES = {
    hopeful:     { label: "Hopeful",     color: "#FCE388" },
    proud:       { label: "Proud",       color: "#BFE3B4" },
    overwhelmed: { label: "Overwhelmed", color: "#F7B8C4" },
    frustrated:  { label: "Frustrated",  color: "#F5C08A" },
    scared:      { label: "Scared",      color: "#D3B6E0" },
    numb:        { label: "Numb",        color: "#AFCBE3" },
  };
  const VIBE_KEYS = Object.keys(VIBES);

  const STAGES = [
    "Post-Injury / Pre-Op",
    "Post-Op – 9 Months",
    "9+ Months / Full Recovery",
  ];
  const COL_WIDTH = 420;
  const NOTE_WIDTH = 176;
  const COL_MARGIN = 24;
  const BOARD_HEIGHT = 1300;
  const BOARD_WIDTH = STAGES.length * COL_WIDTH + 40;

  let notes = [];
  let profileName = "";
  let zCounter = 10;

  const boardEl = document.getElementById("board");
  const boardScroll = document.getElementById("board-scroll");
  const modalRoot = document.getElementById("modal-root");
  const boardHint = document.getElementById("board-hint");
  const statsRow = document.getElementById("stats-row");

  boardEl.style.width = BOARD_WIDTH + "px";
  boardEl.style.height = BOARD_HEIGHT + "px";

  function colBounds(stageIndex) {
    const start = stageIndex * COL_WIDTH + COL_MARGIN + 20;
    const end = start + COL_WIDTH - NOTE_WIDTH - COL_MARGIN;
    return { start, end: Math.max(start, end) };
  }

  function hashJitter(id, range) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return range <= 0 ? 0 : h % range;
  }

  const SEED_NOTES = [
    { id: "seed-1", stage: 0, y: 90, vibe: "scared", name: "D. Ocampo", surgery: "ACL — Patellar Tendon Graft",
      body: "surgery's in 4 days and I keep googling things I shouldn't. someone tell me what actually got you through this week.",
      timestamp: Date.now() - 1000*60*60*24*40,
      replies: [{ author: "sarah_k", body: "Stop googling re-tear rates. I watched an embarrassing amount of competitive baking shows instead.", timestamp: Date.now() - 1000*60*60*24*39 }] },
    { id: "seed-2", stage: 1, y: 140, vibe: "overwhelmed", name: "JT", surgery: "ACL — Hamstring Graft",
      body: "nobody warned me the couch would start feeling like a cage. is this normal or am I being dramatic.",
      timestamp: Date.now() - 1000*60*60*24*25,
      replies: [
        { author: "miguel.r", body: "Not dramatic. Weeks 3–6 were worse for me mentally than surgery day itself.", timestamp: Date.now() - 1000*60*60*24*24 },
        { author: "sarah_k", body: "I started doing PT at the same time every day just to give the day a shape again.", timestamp: Date.now() - 1000*60*60*24*23 }
      ] },
    { id: "seed-3", stage: 1, y: 90, vibe: "proud", name: "Sarah K.", surgery: "ACL — Quad Tendon Graft",
      body: "hit 90% quad strength symmetry today and cried in the parking lot. the good kind.",
      timestamp: Date.now() - 1000*60*60*24*6, replies: [] },
    { id: "seed-4", stage: 1, y: 420, vibe: "numb", name: "Miguel R.", surgery: "ACL — Allograft",
      body: "first pickup game back. flinched at every single cut. nobody talks about the gap between cleared and trusting it again.",
      timestamp: Date.now() - 1000*60*60*24*2, replies: [] },
    { id: "seed-5", stage: 1, y: 250, vibe: "frustrated", name: "Priya", surgery: "ACL — Hamstring Graft",
      body: "swelling won't quit and my PT keeps saying 'it's normal.' tell me it eventually just stops.",
      timestamp: Date.now() - 1000*60*60*24*10, replies: [] },
    { id: "seed-6", stage: 2, y: 200, vibe: "hopeful", name: "Alex T.", surgery: "ACL — Patellar Tendon Graft",
      body: "13 months out. cleared for everything. still get a flicker of nerves before I plant on it hard, but it holds. every time.",
      timestamp: Date.now() - 1000*60*60*24*1, replies: [] },
  ];

  SEED_NOTES.forEach(n => { const b = colBounds(n.stage); n.x = b.start + hashJitter(n.id, b.end - b.start); });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function buildMetaHtml(n) {
    let rows = `<div><b>NAME</b> ${escapeHtml(n.name || "Anonymous")}</div>`;
    if (n.howInjured) rows += `<div><b>HOW INJURED</b> ${escapeHtml(n.howInjured)}</div>`;
    if (n.timeSinceInjury) rows += `<div><b>TIME SINCE INJURY</b> ${escapeHtml(n.timeSinceInjury)}</div>`;
    if (n.surgery) rows += `<div><b>SURGERY</b> ${escapeHtml(n.surgery)}</div>`;
    rows += `<div><b>RECOVERY</b> ${escapeHtml(STAGES[n.stage])}</div>`;
    return rows;
  }

  // Persist the "your name" convenience field wherever we can — the chat-only
  // storage when previewing inside Claude, or the browser once this is a real deployed site.
  async function getPersisted(key) {
    if (window.storage) {
      try { const r = await window.storage.get(key, false); return r ? r.value : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  async function setPersisted(key, value) {
    if (window.storage) {
      try { await window.storage.set(key, value, false); } catch (e) {}
      return;
    }
    try { localStorage.setItem(key, value); } catch (e) {}
  }

  function dbRowToNote(row) {
    return {
      id: row.id, x: row.x, y: row.y, stage: row.stage, vibe: row.vibe,
      name: row.name, howInjured: row.how_injured, timeSinceInjury: row.time_since_injury,
      surgery: row.surgery, body: row.body,
      timestamp: row.created_at ? new Date(row.created_at).getTime() : Date.now(),
      replies: (row.replies || [])
        .slice()
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
        .map(r => ({ author: r.author, body: r.body, timestamp: new Date(r.created_at).getTime() }))
    };
  }

  async function loadAll() {
    const { data, error } = await sbClient
      .from("notes")
      .select("*, replies(*)")
      .order("created_at", { ascending: true });

    if (error) {
      console.error("Failed to load notes:", error);
      boardHint.textContent = "Couldn't load the board — " + (error.message || "unknown error") + (error.hint ? " (" + error.hint + ")" : "");
      boardHint.style.display = "block";
      notes = [];
    } else if (!data || data.length === 0) {
      notes = SEED_NOTES;
      await seedInitialNotes();
    } else {
      notes = data.map(dbRowToNote);
    }

    profileName = (await getPersisted(PROFILE_KEY)) || "";
    renderTimelineHeader();
    renderBoard();
    renderStats();
  }

  async function seedInitialNotes() {
    for (const n of SEED_NOTES) {
      const { error } = await sbClient.from("notes").insert({
        id: n.id, x: n.x, y: n.y, stage: n.stage, vibe: n.vibe,
        name: n.name, how_injured: n.howInjured || null, time_since_injury: n.timeSinceInjury || null,
        surgery: n.surgery, body: n.body
      });
      if (!error) {
        for (const r of n.replies) {
          await sbClient.from("replies").insert({ note_id: n.id, author: r.author, body: r.body });
        }
      }
    }
  }

  async function insertNote(note) {
    const { error } = await sbClient.from("notes").insert({
      id: note.id, x: note.x, y: note.y, stage: note.stage, vibe: note.vibe,
      name: note.name || null, how_injured: note.howInjured || null,
      time_since_injury: note.timeSinceInjury || null, surgery: note.surgery || null, body: note.body
    });
    if (error) console.error("Failed to insert note:", error);
    return !error;
  }

  async function updateNotePosition(note) {
    const { error } = await sbClient.from("notes").update({ x: note.x, y: note.y }).eq("id", note.id);
    if (error) console.error("Failed to update note position:", error);
    return !error;
  }

  async function insertReply(noteId, author, body) {
    const { error } = await sbClient.from("replies").insert({ note_id: noteId, author: author || null, body });
    if (error) console.error("Failed to insert reply:", error);
    return !error;
  }

  async function deleteNote(id) {
    const { error } = await sbClient.from("notes").delete().eq("id", id);
    if (error) console.error("Failed to delete note:", error);
    return !error;
  }

  async function saveProfileName(name) {
    profileName = name;
    await setPersisted(PROFILE_KEY, name);
  }

  function renderTimelineHeader() {
    const header = document.createElement("div");
    header.className = "timeline-header";

    STAGES.forEach((label, i) => {
      const col = document.createElement("div");
      col.className = "timeline-col-label";
      col.style.left = (i * COL_WIDTH + 20) + "px";
      col.style.width = COL_WIDTH + "px";
      col.innerHTML = `<span>${escapeHtml(label)}</span>`;
      header.appendChild(col);

      if (i > 0) {
        const divider = document.createElement("div");
        divider.className = "timeline-divider";
        divider.style.left = (i * COL_WIDTH + 20) + "px";
        divider.style.height = BOARD_HEIGHT + "px";
        boardEl.appendChild(divider);
      }
    });
    const arrow = document.createElement("div");
    arrow.className = "timeline-arrow";
    arrow.textContent = "injury → full recovery →";
    header.appendChild(arrow);

    boardEl.appendChild(header);
  }

  function renderStats() {
    const totalNotes = notes.length;
    const totalReplies = notes.reduce((sum, n) => sum + n.replies.length, 0);
    const graftSet = new Set(notes.map(n => (n.surgery || "").trim().toLowerCase()).filter(Boolean));
    statsRow.innerHTML = `
      <div class="stat"><b>${totalNotes}</b>notes pinned</div>
      <div class="stat"><b>${totalReplies}</b>responses</div>
      <div class="stat"><b>${graftSet.size}</b>graft types shared</div>
    `;
  }

  function renderBoard() {
    boardHint.style.display = notes.length ? "none" : "block";
    Array.from(boardEl.querySelectorAll(".note-wrap")).forEach(el => el.remove());

    notes.forEach(n => {
      const vibe = VIBES[n.vibe] || VIBES.hopeful;
      const wrap = document.createElement("div");
      wrap.className = "note-wrap";
      wrap.style.left = n.x + "px";
      wrap.style.top = n.y + "px";
      wrap.style.zIndex = zCounter++;
      wrap.tabIndex = 0;
      wrap.dataset.id = n.id;

      wrap.innerHTML = `
        <div class="note" style="--note-color:${vibe.color};">
          <div class="note-head">
            <span class="note-from">${escapeHtml(n.name || "Anonymous")}</span>
            <span class="note-stage-dot" title="${escapeHtml(STAGES[n.stage])}"></span>
          </div>
          <div class="note-body-wrap">
            <p class="note-body">${escapeHtml(n.body)}</p>
            <div class="note-footer">${vibe.label} · ${n.replies.length} ${n.replies.length === 1 ? "reply" : "replies"}</div>
          </div>
        </div>
      `;

      attachDrag(wrap, n);
      boardEl.appendChild(wrap);
    });
  }

  function attachDrag(wrap, note) {
    let startX, startY, origX, origY, moved;
    const bounds = colBounds(note.stage);

    wrap.addEventListener("pointerdown", (e) => {
      if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
      wrap.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origX = note.x; origY = note.y;
      moved = false;
      wrap.style.zIndex = zCounter++;
      wrap.classList.add("dragging");
      e.preventDefault();
    });

    wrap.addEventListener("pointermove", (e) => {
      if (startX === undefined) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (moved) {
        note.x = Math.min(bounds.end, Math.max(bounds.start, origX + dx));
        note.y = Math.min(BOARD_HEIGHT - 140, Math.max(50, origY + dy));
        wrap.style.left = note.x + "px";
        wrap.style.top = note.y + "px";
      }
    });

    const finishDrag = async () => {
      if (startX === undefined) return;
      wrap.classList.remove("dragging");
      startX = undefined;
      if (moved) {
        await updateNotePosition(note);
        wrap.dataset.justDragged = "1";
        setTimeout(() => { delete wrap.dataset.justDragged; }, 50);
      }
    };
    wrap.addEventListener("pointerup", finishDrag);
    wrap.addEventListener("pointercancel", finishDrag);

    wrap.addEventListener("click", (e) => {
      e.stopPropagation();
      if (wrap.dataset.justDragged) return;
      openThreadModal(note.id);
    });
    wrap.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openThreadModal(note.id); }
    });
  }

  function closeModal() { modalRoot.innerHTML = ""; }

  function openThreadModal(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    const vibe = VIBES[note.vibe] || VIBES.hopeful;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

    overlay.innerHTML = `
      <div class="modal">
        <button class="modal-close" aria-label="Close">&times;</button>
        <div class="modal-note-preview" style="background:${vibe.color};">
          <div class="note-meta">
            ${buildMetaHtml(note)}
          </div>
          <hr class="note-divider" />
          <p class="note-body">${escapeHtml(note.body)}</p>
        </div>
        <div class="replies-heading">${note.replies.length} ${note.replies.length === 1 ? "reply" : "replies"}</div>
        <div id="replies-list"></div>
        <div class="field">
          <label for="reply-name">Your name <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
          <input type="text" id="reply-name" value="${escapeHtml(profileName)}" placeholder="how you want to show up" />
        </div>
        <div class="field">
          <label for="reply-body">Reply</label>
          <textarea id="reply-body" placeholder="what helped, what you're going through, a question..."></textarea>
        </div>
        <div id="reply-error"></div>
        <div class="form-actions">
          <button class="btn-primary" id="reply-submit">Post reply</button>
          <button class="btn-secondary" id="reply-cancel">Close</button>
        </div>
        <div style="margin-top:22px; padding-top:16px; border-top:1px solid #DDDDDD;">
          <button class="btn-secondary" id="delete-note-btn" style="color:#A83A3A; border-color:#E0B8B8;">Delete this note</button>
          <div id="delete-confirm" style="display:none; margin-top:10px;">
            <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Delete this note and all its replies? This can't be undone.</div>
            <div class="form-actions" style="margin-top:0;">
              <button class="btn-primary" id="delete-confirm-yes" style="background:#A83A3A;">Yes, delete it</button>
              <button class="btn-secondary" id="delete-confirm-no">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    `;

    const repliesList = overlay.querySelector("#replies-list");
    note.replies.slice().sort((a, b) => a.timestamp - b.timestamp).forEach(r => {
      const item = document.createElement("div");
      item.className = "reply-item";
      item.innerHTML = `<div class="reply-author">${escapeHtml(r.author || "Anonymous")}</div><div class="reply-body">${escapeHtml(r.body)}</div>`;
      repliesList.appendChild(item);
    });

    overlay.querySelector(".modal-close").onclick = closeModal;
    overlay.querySelector("#reply-cancel").onclick = closeModal;
    overlay.querySelector("#reply-submit").onclick = async () => {
      const name = overlay.querySelector("#reply-name").value.trim();
      const body = overlay.querySelector("#reply-body").value.trim();
      const errDiv = overlay.querySelector("#reply-error");
      errDiv.innerHTML = "";
      if (!body) {
        errDiv.innerHTML = `<div class="error-note">Write a reply before posting.</div>`;
        return;
      }
      note.replies.push({ author: name, body, timestamp: Date.now() });
      const ok = await insertReply(note.id, name, body);
      if (!ok) {
        note.replies.pop();
        errDiv.innerHTML = `<div class="error-note">Couldn't save that reply — try again.</div>`;
        return;
      }
      if (name) await saveProfileName(name);
      closeModal();
      renderBoard();
      renderStats();
    };

    overlay.querySelector("#delete-note-btn").onclick = () => {
      overlay.querySelector("#delete-confirm").style.display = "block";
      overlay.querySelector("#delete-note-btn").style.display = "none";
    };
    overlay.querySelector("#delete-confirm-no").onclick = () => {
      overlay.querySelector("#delete-confirm").style.display = "none";
      overlay.querySelector("#delete-note-btn").style.display = "inline-block";
    };
    overlay.querySelector("#delete-confirm-yes").onclick = async () => {
      const yesBtn = overlay.querySelector("#delete-confirm-yes");
      yesBtn.disabled = true;
      yesBtn.textContent = "Deleting…";
      const ok = await deleteNote(note.id);
      if (!ok) {
        yesBtn.disabled = false;
        yesBtn.textContent = "Yes, delete it";
        overlay.querySelector("#delete-confirm").insertAdjacentHTML("beforeend", `<div class="error-note">Couldn't delete — try again.</div>`);
        return;
      }
      notes = notes.filter(n => n.id !== note.id);
      closeModal();
      renderBoard();
      renderStats();
    };

    modalRoot.appendChild(overlay);
  }

  function openNewNoteModal(preset) {
    preset = preset || {};
    let selectedVibe = "hopeful";
    const initialStage = preset.stage != null ? preset.stage : 0;

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

    overlay.innerHTML = `
      <div class="modal">
        <button class="modal-close" aria-label="Close">&times;</button>
        <p class="form-title">Pin a sticky note</p>
        <div class="field">
          <label for="nn-name">Name <span style="text-transform:none; letter-spacing:0;">(optional — leave blank to stay anonymous)</span></label>
          <input type="text" id="nn-name" value="${escapeHtml(profileName)}" placeholder="how you want to show up" />
        </div>
        <div class="field">
          <label for="nn-injured">How did you get injured? <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
          <input type="text" id="nn-injured" placeholder="e.g. landed wrong in a pickup game" />
        </div>
        <div class="field">
          <label for="nn-time-since">Time since injury <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
          <input type="text" id="nn-time-since" placeholder="e.g. 5 months since the tear" />
        </div>
        <div class="field">
          <label for="nn-surgery">Surgery <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
          <input type="text" id="nn-surgery" placeholder="e.g. ACL — Hamstring Graft" />
        </div>
        <div class="field">
          <label for="nn-stage">Point in recovery</label>
          <select id="nn-stage">${STAGES.map((s, i) => `<option value="${i}" ${i === initialStage ? "selected" : ""}>${s}</option>`).join("")}</select>
        </div>
        <div class="field">
          <label>Vibe (this sets the note's color)</label>
          <div class="vibe-picker" id="vibe-picker"></div>
        </div>
        <div class="field">
          <label for="nn-body">Your note</label>
          <textarea id="nn-body" placeholder="say what's real — keep it short, like an actual sticky note"></textarea>
        </div>
        <div id="nn-error"></div>
        <div class="form-actions">
          <button class="btn-primary" id="nn-submit">Pin it to the board</button>
          <button class="btn-secondary" id="nn-cancel">Cancel</button>
        </div>
      </div>
    `;

    const picker = overlay.querySelector("#vibe-picker");
    VIBE_KEYS.forEach(k => {
      const sw = document.createElement("div");
      sw.className = "vibe-swatch" + (k === selectedVibe ? " selected" : "");
      sw.innerHTML = `<span class="dot" style="background:${VIBES[k].color};"></span><span>${escapeHtml(VIBES[k].label)}</span>`;
      sw.onclick = () => {
        selectedVibe = k;
        Array.from(picker.children).forEach(c => c.classList.remove("selected"));
        sw.classList.add("selected");
      };
      picker.appendChild(sw);
    });

    overlay.querySelector(".modal-close").onclick = closeModal;
    overlay.querySelector("#nn-cancel").onclick = closeModal;
    overlay.querySelector("#nn-submit").onclick = async () => {
      const name = overlay.querySelector("#nn-name").value.trim();
      const howInjured = overlay.querySelector("#nn-injured").value.trim();
      const timeSinceInjury = overlay.querySelector("#nn-time-since").value.trim();
      const surgery = overlay.querySelector("#nn-surgery").value.trim();
      const stage = parseInt(overlay.querySelector("#nn-stage").value, 10);
      const body = overlay.querySelector("#nn-body").value.trim();
      const errDiv = overlay.querySelector("#nn-error");
      errDiv.innerHTML = "";
      if (!body) {
        errDiv.innerHTML = `<div class="error-note">Write your note before pinning it.</div>`;
        return;
      }

      const bounds = colBounds(stage);
      let x, y;
      if (preset.stage === stage && preset.x != null && preset.y != null) {
        x = Math.min(bounds.end, Math.max(bounds.start, preset.x - NOTE_WIDTH / 2));
        y = Math.min(BOARD_HEIGHT - 140, Math.max(50, preset.y - 60));
      } else {
        x = bounds.start + Math.random() * Math.max(1, bounds.end - bounds.start);
        y = 70 + Math.random() * (BOARD_HEIGHT - 220);
      }

      const newNote = {
        id: "note-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        x, y, stage, vibe: selectedVibe, name, howInjured, timeSinceInjury, surgery, body,
        timestamp: Date.now(), replies: []
      };
      notes.push(newNote);
      const ok = await insertNote(newNote);
      if (!ok) {
        notes.pop();
        errDiv.innerHTML = `<div class="error-note">Couldn't save your note — try again.</div>`;
        return;
      }
      if (name) await saveProfileName(name);
      closeModal();
      renderBoard();
      renderStats();
    };

    modalRoot.appendChild(overlay);
  }

  document.getElementById("topbar-add").onclick = () => openNewNoteModal();

  boardEl.addEventListener("click", (e) => {
    if (e.target !== boardEl) return;
    const rect = boardEl.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    let stage = Math.floor((clickX - 20) / COL_WIDTH);
    stage = Math.min(STAGES.length - 1, Math.max(0, stage));
    openNewNoteModal({ stage, x: clickX, y: clickY });
  });

  loadAll();
})();
</script>
